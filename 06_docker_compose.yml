version: '3.9'

services:
  # ========================================================================
  # DATABASES
  # ========================================================================
  
  postgres:
    image: pgvector/pgvector:pg16-latest
    container_name: geomind_postgres
    environment:
      POSTGRES_USER: geomind_user
      POSTGRES_PASSWORD: geomind_secure_password
      POSTGRES_DB: geomind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geomind_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geomind_network
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=vector"

  redis:
    image: redis:7-alpine
    container_name: geomind_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geomind_network

  # ========================================================================
  # BACKEND API
  # ========================================================================
  
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geomind_backend
    environment:
      DATABASE_URL: "postgresql+asyncpg://geomind_user:geomind_secure_password@postgres:5432/geomind_db"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET_KEY: "your-secret-key-change-in-production"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LOG_LEVEL: "info"
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - geomind_network
    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn main:app --host 0.0.0.0 --port 8000 --reload
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================================================
  # WORKER (CELERY)
  # ========================================================================
  
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geomind_worker
    environment:
      DATABASE_URL: "postgresql+asyncpg://geomind_user:geomind_secure_password@postgres:5432/geomind_db"
      REDIS_URL: "redis://redis:6379"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LOG_LEVEL: "info"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      - backend
      - redis
      - postgres
    networks:
      - geomind_network
    command: >
      celery -A tasks worker
      --loglevel=info
      --concurrency=4
      --max-tasks-per-child=1000

  # ========================================================================
  # BEAT (SCHEDULED TASKS)
  # ========================================================================
  
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geomind_beat
    environment:
      DATABASE_URL: "postgresql+asyncpg://geomind_user:geomind_secure_password@postgres:5432/geomind_db"
      REDIS_URL: "redis://redis:6379"
      LOG_LEVEL: "info"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - backend
      - redis
    networks:
      - geomind_network
    command: >
      celery -A tasks beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler

  # ========================================================================
  # FRONTEND
  # ========================================================================
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://backend:8000/api/v1"
    container_name: geomind_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://backend:8000/api/v1"
      NODE_ENV: "production"
    depends_on:
      - backend
    networks:
      - geomind_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================================================
  # NGINX REVERSE PROXY
  # ========================================================================
  
  nginx:
    image: nginx:latest
    container_name: geomind_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - geomind_network

  # ========================================================================
  # MONITORING & LOGGING
  # ========================================================================
  
  prometheus:
    image: prom/prometheus:latest
    container_name: geomind_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - geomind_network

  grafana:
    image: grafana/grafana:latest
    container_name: geomind_grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - geomind_network

  # ========================================================================
  # VECTOR DB MANAGEMENT (Optional)
  # ========================================================================
  
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: geomind_pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@geomind.local"
      PGADMIN_DEFAULT_PASSWORD: "admin"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - geomind_network
    depends_on:
      - postgres

# ========================================================================
# VOLUMES
# ========================================================================

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  pgadmin_data:
  nginx_cache:

# ========================================================================
# NETWORKS
# ========================================================================

networks:
  geomind_network:
    driver: bridge
